# The operator's (dev box's) cluster-admin identity, used by kubectl once the
# shared IAM role has become a node identity (see 20_up.sh, "node identity").
# The token lives only in ~/.kube/<TEST_RUN_ID>-sa.yaml and dies with the cluster.
apiVersion: v1
kind: ServiceAccount
metadata: { name: test-operator, namespace: kube-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: test-operator-admin }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects: [ { kind: ServiceAccount, name: test-operator, namespace: kube-system } ]
---
apiVersion: v1
kind: Secret
metadata:
  name: test-operator-token
  namespace: kube-system
  annotations: { kubernetes.io/service-account.name: test-operator }
type: kubernetes.io/service-account-token
