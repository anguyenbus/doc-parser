[project]
name = "parser-service"
version = "0.1.0"
description = "Document parsing service: Docling + AWS Bedrock Claude Sonnet hybrid pipeline"
requires-python = ">=3.11"
dependencies = [
    # exact version is pinned by uv.lock; it is part of the page-pipeline config hash
    "docling>=2.138,<3",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "boto3>=1.35.2",
    "pydantic>=2.7",
    "pypdf>=6.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Only needed to create fixture files programmatically
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
serve = [
    "kserve==0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parser_service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real Bedrock credentials (manual or nightly only)",
    "slow: full eval-harness run, weekly only",
    "kserve: needs the kserve SDK (the serve extra); skipped without it",
]
