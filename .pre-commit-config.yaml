# Pre-commit hooks for parser-service
# Install: pre-commit install
# Run all: pre-commit run --all-files
#
# NOTE: pytest is NOT included as a pre-commit hook because it is too slow
# (Docling downloads models on first run). Run `uv run pytest` manually.

default_language_version:
  python: python3.13

# All linters run in the PROJECT environment via `uv run`, so the hooks use the
# exact ruff/mypy versions pinned in pyproject.toml — no isolated-venv version
# drift (a pinned ruff-pre-commit rev reformats differently than the project's
# ruff). Config lives in pyproject.toml ([tool.ruff], [tool.mypy]).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (uv, lint --fix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (uv)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (uv, strict)
        entry: uv run mypy src scripts tests
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
