# Config for the doc-bench wheel grader.
# The `doc-bench` CLI reads THIS file (eval_config.yaml) from the CWD — the
# filename is fixed (no --config flag on the grader). dump-dataset takes --config.
# Dataset data ships in the doc-bench repo under baseline/; point at it here.
datasets:
  omnidocbench:
    path: ${OMNIDOCBENCH_PATH:-/home/admin/projects/doc-parser/references/doc-bench/baseline/omnidocbench}
  dp_bench:
    path: ${DP_BENCH_PATH:-/home/admin/projects/doc-parser/references/doc-bench/baseline/dp_bench}

metrics:
  parsing:
    bleu: true
    meteor: true
    nid: true
    ard: true
    teds: true
    mhs: true

# Required section (validated for presence). Parsing runs on the host; the
# wheel no longer bundles in-process parsers.
models:
  parser:
    type: external
    description: "doc-parser (parser_service) — predictions graded file-based"
